[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grudge-cli"
version = "0.2.0"
description = "Deterministic regression scars for agent mistakes."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [{name = "Grudge contributors"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
keywords = ["agents", "testing", "regression", "guardrails"]
dependencies = [
    "pydantic==2.12.5",
    "typer==0.15.1",
    "click==8.1.8",
    # Bounded, not exact: an exact pin here forces every user who also installs
    # twine (rich>=14.3.3) into an unsatisfiable resolution.
    "rich>=13.9.4,<15",
    "httpx==0.28.1",
]

[project.urls]
Homepage = "https://github.com/harshithKumar12/Grudge"
Repository = "https://github.com/harshithKumar12/Grudge"
Issues = "https://github.com/harshithKumar12/Grudge/issues"

[project.optional-dependencies]
dev = [
    # 9.0.3+ clears PYSEC-2026-1845; still <10 for pytest-asyncio (<10) and
    # pytest-cov, and the whole suite passes on 9.2.0.
    "pytest>=9.0.3,<10",
    "pytest-cov==6.0.0",
    "hypothesis==6.123.10",
    "ruff==0.14.14",
    "mypy==1.18.2",
]

[project.scripts]
grudge = "grudge.cli.main:app"
grudge-engine = "grudge.cli.main:app"

[tool.setuptools.packages.find]
include = ["grudge*", "examples*", "scars*"]

[tool.setuptools.package-data]
"grudge.predicates" = ["prompts/*.md"]
"grudge.demo" = ["*.mjs", "payloads/*/*.json"]
"examples.leaky_agent" = ["*.json", "controls/*", "fake_filestore/*"]
scars = ["*.json"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["grudge"]
explicit_package_bases = true
exclude = ["^build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
