[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grudge-cli"
version = "0.1.5"
description = "Deterministic regression scars for agent mistakes."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [{name = "Grudge contributors"}]
dependencies = [
    "pydantic==2.12.5",
    "typer==0.15.1",
    "click==8.1.8",
    "rich==13.9.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "hypothesis==6.123.10",
    "ruff==0.14.14",
    "mypy==1.18.2",
]

[project.scripts]
grudge = "grudge.cli.main:app"

[tool.setuptools.packages.find]
include = ["grudge*", "examples*"]

[tool.setuptools.package-data]
"grudge.predicates" = ["prompts/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["grudge"]
exclude = ["^build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
