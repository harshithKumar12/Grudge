name: Grudge guard

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/grudge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Python tests
        shell: bash
        run: python -m pytest -q
      - name: Python lint and types
        shell: bash
        run: |
          python -m ruff check .
          python -m mypy .
      - name: Documentation and release checks
        shell: bash
        run: |
          python -m scripts.docs_check
          python -m scripts.release_check
      - name: Node install, tests, and build
        working-directory: packages/grudge
        run: |
          npm ci
          npm test
          npm run build
      - name: Pack contents
        working-directory: packages/grudge
        run: npm pack --dry-run
