name: Grudge guard
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/grudge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: make install
      - name: Python tests
        run: make test
      - name: Package tests and build
        working-directory: packages/grudge
        run: npm ci && npm test && npm run build
      - name: Package contents
        working-directory: packages/grudge
        run: npm pack --dry-run
